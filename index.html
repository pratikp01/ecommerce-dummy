<!DOCTYPE html>
    <html lang ="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <meta name="description" content="Welcome to Flipkart.com" />
        <title>Flipkart.com | Online Shopping</title>
        <link rel="stylesheet" href="./style.css"> 
        <link rel="stylesheet" href="./reset.css"/>
        <!-- Favicon Images-->
        <link rel="icon" type="image/png" href="./assets/favicon/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
        <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="MyWebSite" />
        <link rel="manifest" href="./assets/favicon/site.webmanifest" />
    </head>
    <body>
        <header>
            <!-- Main Header Nav -->
            <nav class="navbar">
                <div class="logo">
                    <a href="./index.html">
                        <img src="./assets/fkheaderlogo.svg" alt="Header Logo" />
                    </a>
                </div>
                <!-- Search Bar-->
                <div>
                    <form class="search-bar">
                        <button type="submit" class="search-button">
                            <svg width="24" height="24" class="" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><title>Search Icon</title><path d="M10.5 18C14.6421 18 18 14.6421 18 10.5C18 6.35786 14.6421 3 10.5 3C6.35786 3 3 6.35786 3 10.5C3 14.6421 6.35786 18 10.5 18Z" stroke="#717478" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M16 16L21 21" stroke="#717478" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg> 
                        </button>
                        <div>
                            <input type="text" placeholder="Search for Products, Brands and More...." name="search" class="search-text">
                        </div>
                    </form>
                </div>
                <!-- Login Selection-->
                <div class="login-button">
                    <a href="https://mail.google.com">
                        <button >
                            <img src="./assets/profile-login.svg"/>
                            <span>Login</span>
                            <img src="./assets/drop-arrow.svg"/ class="drop-arrow">
                        </button>
                    </a>
                        
                    <div class="login-content">
                        <ul>
                            <li><img src="./assets/profile-icon.svg" alt="profile"><a href="#">My Profile</a></li>
                            <li><img src="./assets/orders.svg" alt="orders"><a href="#">Orders</a></li>
                            <li><img src="./assets/wishlist.svg" alt="wishlist"><a href="#">Wishlist</a></li>
                            <li><img src="./assets/rewards.svg" alt="rewards"><a href="#">Rewards</a></li>
                            <li><img src="./assets/giftCard.svg" alt="giftCard"><a href="#">Gift Cards</a></li>
                        </ul>

                    </div>  
                <!-- Cart Selection-->    
                </div>
                <div class="cart">
                    <button >
                        <img src="./assets/cart.svg" alt="cart"/>
                        <span>Cart</span>
                    </button>
                </div>
                <!-- Support Selection-->    
            </div>
            <div class="helpcenter">
                <a href="./support.html">
                    <button >
                        <img src="./assets/helpcenter.svg" alt="helpcenter"/>
                        <span>24x7 Customer Care</span>
                    </button>
                </a>
            </div>
            </nav>
            <!-- Categories Header Nav-->
            <nav class="categories">
                <ul>
                    <li><a href="#">Grocery</a></li>
                    <li><a href="#">Mobiles</a></li>
                    <li><a href="#">Fashion</a></li>
                    <li><a href="#">Electronics</a></li>
                    <li><a href="#">Home & Furniture</a></li>
                    <li><a href="#">Appliances</a></li>
                    <li><a href="#">Flight Bookings</a></li>
                    <li><a href="#">Beauty, Toys & more..</a></li>
                    <li><a href="#">Two Wheelers</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <p> This is my ecommerce website</p>
        </main>
        <footer>

        </footer>
    </body>
</html>
