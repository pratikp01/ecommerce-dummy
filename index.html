<!DOCTYPE html>
    <html lang ="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width" />
        <meta name="description" content="Welcome to Flipkart.com" />
        <title>Flipkart</title>
        <link rel="stylesheet" href="./style.css"> 
        <link rel="stylesheet" href="./reset.css"/>
        <!-- Favicon Images-->
        <link rel="icon" type="image/png" href="./assets/favicon/favicon-96x96.png" sizes="96x96" />
        <link rel="icon" type="image/svg+xml" href="./assets/favicon/favicon.svg" />
        <link rel="shortcut icon" href="./assets/favicon/favicon.ico" />
        <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="MyWebSite" />
        <link rel="manifest" href="./assets/favicon/site.webmanifest" />

    <body>
        <header>
            <!-- Main Header Nav -->
            <nav>
                <img src="./assets/fkheaderlogo.svg" alt="Header Logo" class="homeicon" />

                    <form>
                        <input type="text" placeholder="Search for Products, Brands and More...." name="search" class="search-text">
                        <button type="submit" class="search-button"></button>
                        
                    </form>

                </div>
            </nav>
            <!-- Categories Header Nav-->
            <nav class="categories">
                <ul>
                    <li><a href="#">Grocery</a></li>
                    <li><a href="#">Mobiles</a></li>
                    <li><a href="#">Fashion</a></li>
                    <li><a href="#">Electronics</a></li>
                    <li><a href="#">Home & Furniture</a></li>
                    <li><a href="#">Appliances</a></li>
                    <li><a href="#">Flight Bookings</a></li>
                    <li><a href="#">Beauty, Toys & more..</a></li>
                    <li><a href="#">Two Wheelers</a></li>
                </ul>
            </nav>
        </header>
        <main>
            <p> This is my ecommerce website</p>
        </main>
        <footer>

        </footer>

</html>
